name: Build API 37.1 APK

on:
  push:
    branches:
      - adapt-latest-systemui-launcher
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install API 37.1 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-37.1" "build-tools;37.0.0"

      - name: Build release APK
        run: bash ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Verify APK installability
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          METHOD="$(unzip -lv "$APK" resources.arsc | awk '$NF == "resources.arsc" {print $2}')"
          test "$METHOD" = "Stored" || {
            echo "resources.arsc must be uncompressed, got: $METHOD" >&2
            exit 1
          }
          "$ANDROID_SDK_ROOT/build-tools/37.0.0/zipalign" -c -P 16 -v 4 "$APK"
          "$ANDROID_SDK_ROOT/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$APK"
          sha256sum app/build/outputs/apk/release/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Xpomni-api-37.1
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30