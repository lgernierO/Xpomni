name: Build API 37.1 APKs

on:
  push:
    branches:
      - adapt-latest-systemui-launcher
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install API 37.1 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-37.1" "build-tools;37.0.0"

      - name: Restore persistent signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.XPOMNI_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.XPOMNI_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.XPOMNI_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.XPOMNI_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          KEYSTORE="$RUNNER_TEMP/xpomni-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"

          {
            printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT"
            printf 'storeFile=%s\n' "$KEYSTORE"
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > local.properties
          chmod 600 local.properties

      - name: Build debug and release APKs
        run: bash ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease

      - name: Verify and stage APKs
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/37.0.0"
          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          DEBUG_OUT="dist/Xpomni-api-37.1-debug.apk"
          RELEASE_OUT="dist/Xpomni-api-37.1-release.apk"

          test -s "$DEBUG_APK"
          test -s "$RELEASE_APK"
          mkdir -p dist
          cp "$DEBUG_APK" "$DEBUG_OUT"
          cp "$RELEASE_APK" "$RELEASE_OUT"

          for APK in "$DEBUG_OUT" "$RELEASE_OUT"; do
            METHOD="$(unzip -lv "$APK" resources.arsc | awk '$NF == "resources.arsc" {print $2}')"
            test "$METHOD" = "Stored" || {
              echo "resources.arsc must be uncompressed in $APK, got: $METHOD" >&2
              exit 1
            }
            "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 "$APK"
            "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          done

          DEBUG_CERT="$($BUILD_TOOLS/apksigner verify --print-certs "$DEBUG_OUT" | awk '/certificate SHA-256 digest:/ {print $NF; exit}')"
          RELEASE_CERT="$($BUILD_TOOLS/apksigner verify --print-certs "$RELEASE_OUT" | awk '/certificate SHA-256 digest:/ {print $NF; exit}')"
          test -n "$DEBUG_CERT"
          test "$DEBUG_CERT" = "$RELEASE_CERT" || {
            echo "Debug and release APK signatures differ." >&2
            exit 1
          }

          sha256sum "$DEBUG_OUT" > "$DEBUG_OUT.sha256"
          sha256sum "$RELEASE_OUT" > "$RELEASE_OUT.sha256"
          {
            echo "### APK verification"
            echo
            echo "Both variants use the same persistent signing certificate."
            echo
            echo "Certificate SHA-256: \`$DEBUG_CERT\`"
            echo
            echo '```text'
            cat "$DEBUG_OUT.sha256" "$RELEASE_OUT.sha256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f local.properties "$RUNNER_TEMP/xpomni-release.jks"

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: Xpomni-api-37.1-debug
          path: |
            dist/Xpomni-api-37.1-debug.apk
            dist/Xpomni-api-37.1-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: Xpomni-api-37.1-release
          path: |
            dist/Xpomni-api-37.1-release.apk
            dist/Xpomni-api-37.1-release.apk.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
